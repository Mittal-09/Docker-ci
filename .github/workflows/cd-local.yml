
name: Local CD Deployment

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy on Local Windows PC
    runs-on: self-hosted

    steps:
      - name: Checkout Latest Code
        uses: actions/checkout@v4

      - name: Check Docker
        shell: push
        run: docker version

      - name: Deploy Flask and MySQL
        shell: push
        run: docker compose up -d --build

      - name: Verify Containers
        shell: pwsh
        run: docker compose ps
